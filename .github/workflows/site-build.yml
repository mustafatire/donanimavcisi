name: Site Build

on:
  push:
    branches: [main]
    paths:
      - 'portal/firsatlar.json'
      - 'build.js'
      - '.github/workflows/site-build.yml'
  schedule:
    # Bot commit'i gelmese bile saatte bir tazele (fiyat geçmişi, arşiv yaşı).
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: site-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Statik siteyi üret
        run: node build.js

      - name: Üretilen dosyaları commit et
        run: |
          git config user.name "donanimavcisi-bot"
          git config user.email "115714485+mustafatire@users.noreply.github.com"
          git add portal
          if git diff --cached --quiet; then
            echo "Değişiklik yok, commit atlandı."
            exit 0
          fi
          git commit -m "Otomatik site üretimi: $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push
